query GetResumes {
  resumes {
    id
    basicInformation {
      id
      name
      label
      image {
        src
        alt
        width
        height
      }
      email
      summary
      location {
        city
        region
      }
    }
    work {
      id
      name
      position
      startDate
      endDate
      summary
      highlights {
        value
      }
    }
    education {
      id
      institution
      area
      studyType
      startDate
      endDate
    }
    awards {
      id
      title
      awarder
      date
    }
    skills {
      id
      name
      keywords
    }
    language {
      id
      label
      value
    }
  }
}
