query GetResumeCertifications {
  resumeCertifications {
    id
    credentialUrl
    resume {
      id
    }
    certification {
      id
      title
      description
      link
      image {
        id
        src
        alt
        width
        height
        fill
        type {
          id
          label
        }
        preview
      }
      language {
        id
        label
        value
      }
    }
  }
}
